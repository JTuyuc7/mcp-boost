name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@mcp-boost"
          always-auth: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Verify npm auth for publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is empty or unavailable in this workflow context."
            exit 1
          fi
          TOKEN_CLEAN="$(printf '%s' "$NPM_TOKEN" | tr -d '\r\n')"
          if [ "${#TOKEN_CLEAN}" -lt 20 ]; then
            echo "NPM_TOKEN looks invalid after sanitization."
            exit 1
          fi
          echo "Sanitized NPM token length: ${#TOKEN_CLEAN}"
          AUTH_FILE="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf "//registry.npmjs.org/:_authToken=%s\n" "$TOKEN_CLEAN" > "$AUTH_FILE"
          export NODE_AUTH_TOKEN="$TOKEN_CLEAN"
          echo "NPM_TOKEN_SANITIZED=$TOKEN_CLEAN" >> "$GITHUB_ENV"
          npm whoami
          npm org ls mcp-boost --json

      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ env.NPM_TOKEN_SANITIZED }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN_SANITIZED }}
